name: Release builds

# Push a tag like v0.1.0 to build web, Windows, Linux and macOS and attach them to a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_RELEASE: 4.7.2-stable
  TEMPLATE_DIR: 4.7.2.stable

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"
          unzip -q -j templates.tpz -d "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"
          rm templates.tpz godot.zip

      - name: Full project checks
        env:
          TATO_QA_DIR: qa/build
        run: bash tools/check.sh

      - name: Export everything
        run: tools/build.sh all

      - name: Package
        run: |
          cd build
          (cd web && zip -q -r ../tato-web.zip .)
          (cd windows && zip -q -r ../tato-windows.zip .)
          (cd linux && zip -q -r ../tato-linux.zip .)
          cp macos/Tato.zip tato-macos.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/tato-web.zip
            build/tato-windows.zip
            build/tato-linux.zip
            build/tato-macos.zip
          generate_release_notes: true
