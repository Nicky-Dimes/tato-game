name: Web build and GitHub Pages

# Builds the browser version and publishes it with GitHub Pages.
# One-time setup in the repository: Settings > Pages > Source = "GitHub Actions".
on:
  # Manual only. The play-online site is published from the `gh-pages` branch, which
  # holds the web build made and checked on the development Mac (docs/PUBLISHING.md).
  # Run this by hand only after switching Settings > Pages > Source to "GitHub Actions".
  workflow_dispatch:

env:
  GODOT_RELEASE: 4.7.2-stable
  TEMPLATE_DIR: 4.7.2.stable

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"
          unzip -q -j templates.tpz "templates/web_nothreads_release.zip" "templates/web_nothreads_debug.zip" "templates/version.txt" -d "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"
          rm templates.tpz godot.zip

      - name: Full project checks
        env:
          TATO_QA_DIR: qa/build
        run: bash tools/check.sh

      - name: Export for the web
        run: tools/build.sh web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
