name: Tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project
        run: godot --headless --path game --import

      - name: Every script, scene and resource loads
        run: godot --headless --path game res://tools/CheckScripts.tscn

      - name: Unit and integration tests
        run: |
          godot --headless --fixed-fps 60 --path game res://tests/TestRunner.tscn -- --group=unit
          godot --headless --fixed-fps 60 --path game res://tests/TestRunner.tscn -- --group=integration

      - name: Robot playthrough of every stage
        run: godot --headless --fixed-fps 60 --path game res://tests/TestRunner.tscn -- --group=smoke
