<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="TATO!">
		<meta name="theme-color" content="#301444">
		<link rel="apple-touch-icon" href="index.180x180.png">
		<title>TATO!</title>
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	height: 100%;
	overflow: hidden;
	background-color: #301444;
	color: #fff9ef;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;
	font-family: -apple-system, 'Avenir Next', 'Segoe UI', Roboto, sans-serif;
}

/* Keep the game clear of notches and the home bar. */
#frame {
	position: fixed;
	top: env(safe-area-inset-top, 0px);
	right: env(safe-area-inset-right, 0px);
	bottom: env(safe-area-inset-bottom, 0px);
	left: env(safe-area-inset-left, 0px);
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	border: 0;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	inset: 0;
	background-color: #fdf2e0;
	color: #301444;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	z-index: 2;
}

#status-splash {
	width: min(46vw, 46vh);
	height: auto;
	animation: bob 1.6s ease-in-out infinite;
}

@keyframes bob {
	0%, 100% { transform: translateY(0) scale(1, 1); }
	50% { transform: translateY(-8px) scale(1.02, 0.98); }
}

@media (prefers-reduced-motion: reduce) {
	#status-splash { animation: none; }
}

#status-title {
	font-size: clamp(18px, 4vw, 30px);
	font-weight: 700;
	letter-spacing: 0.02em;
}

#status-progress {
	appearance: none;
	-webkit-appearance: none;
	width: min(60vw, 420px);
	height: 18px;
	border: 4px solid #301444;
	border-radius: 14px;
	background: #f3e6d2;
	overflow: hidden;
}

#status-progress::-webkit-progress-bar { background: #f3e6d2; }
#status-progress::-webkit-progress-value { background: #ff9a1f; }
#status-progress::-moz-progress-bar { background: #ff9a1f; }

#status-detail {
	display: none;
	max-width: 86vw;
	font-size: 12px;
	line-height: 1.35;
	opacity: 0.75;
	text-align: center;
	word-break: break-word;
}

#status-notice {
	display: none;
	max-width: 80vw;
	background: #fff9ef;
	border: 4px solid #301444;
	border-radius: 16px;
	padding: 14px 18px;
	line-height: 1.35;
	text-align: center;
}

/* Phones held upright: ask for a turn (the game is landscape). */
#rotate {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 3;
	background: #301444;
	color: #fff9ef;
	align-items: center;
	justify-content: center;
	text-align: center;
	font-size: 22px;
	font-weight: 700;
	padding: 24px;
}

@media (orientation: portrait) and (max-width: 600px) {
	#rotate { display: flex; }
}
		</style>
		<script>
// Older phones and tablets draw a lot of pixels on their sharp screens.
// Rendering at a gentler pixel ratio keeps the game smooth; "Graphics
// detail" in Settings (or ?dpr=2 in the address) changes it.
(function () {
	var real = window.devicePixelRatio || 1;
	var touch = (navigator.maxTouchPoints || 0) > 1;
	var cap = touch ? 1.5 : 2;
	try {
		var q = localStorage.getItem('tato_quality');
		if (q === 'low') { cap = 1; }
		if (q === 'high') { cap = touch ? 2 : 3; }
	} catch (e) { /* private mode: keep defaults */ }
	var m = /[?&]dpr=([0-9.]+)/.exec(window.location.search);
	if (m) { cap = Math.max(0.5, Math.min(3, parseFloat(m[1]))); }
	if (real > cap) {
		try {
			Object.defineProperty(window, 'devicePixelRatio', { get: function () { return cap; } });
		} catch (e) { /* leave as is */ }
	}
}());
		</script>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<div id="frame">
			<canvas id="canvas">
				Your browser does not support the canvas tag.
			</canvas>
		</div>

		<noscript>
			TATO! needs JavaScript to run.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="Tato">
			<div id="status-title">Warming up the kitchen...</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
			<div id="status-detail"></div>
		</div>
		<div id="rotate">Turn your device sideways to play</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":60069756,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
// What went wrong, if anything: engine error output and uncaught page errors.
// Shown on the loading screen when start-up stalls, so a photo of the screen is
// enough to diagnose a device that will not start.
const tatoProblems = [];
function tatoNote(text) {
	text = String(text || '').trim();
	if (text && tatoProblems.indexOf(text) < 0) {
		tatoProblems.push(text.slice(0, 220));
		if (tatoProblems.length > 4) { tatoProblems.shift(); }
	}
}
window.addEventListener('error', function (e) { tatoNote(e.message || (e.error && e.error.message)); });
window.addEventListener('unhandledrejection', function (e) {
	const r = e.reason;
	tatoNote((r && (r.message || r.toString())) || 'a start-up step was rejected');
});
const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
	'onPrintError': function () {
		const line = Array.prototype.slice.call(arguments).join(' ');
		console.error(line);
		if (/error|abort|exception|out of memory|unreachable|failed/i.test(line)) { tatoNote(line); }
	},
}));

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusTitle = document.getElementById('status-title');

	const statusDetail = document.getElementById('status-detail');
	const debug = /[?&]debug=1/.test(window.location.search);
	let initializing = true;
	let stage = 'checking for a newer version';
	let stageSince = Date.now();
	let percent = -1;
	const began = Date.now();

	function setStage(name, title) {
		if (stage !== name) {
			stage = name;
			stageSince = Date.now();
		}
		if (title && initializing) {
			statusTitle.textContent = title;
		}
	}

	function deviceLine() {
		const ua = navigator.userAgent || '';
		const ver = (/Version\/([0-9.]+)/.exec(ua) || /OS ([0-9_]+)/.exec(ua) || [])[1] || '?';
		let gl = 'no';
		try { gl = document.createElement('canvas').getContext('webgl2') ? 'yes' : 'no'; } catch (e) { gl = 'error'; }
		return 'Safari/OS ' + ver.replace(/_/g, '.') + ' · screen ' + window.innerWidth + 'x' + window.innerHeight +
			' @' + (window.devicePixelRatio || 1) + ' · touch ' + (navigator.maxTouchPoints || 0) +
			' · WebGL2 ' + gl + (navigator.deviceMemory ? ' · memory ' + navigator.deviceMemory + ' GB' : '');
	}

	function showDetail() {
		const secs = Math.round((Date.now() - began) / 1000);
		const inStage = Math.round((Date.now() - stageSince) / 1000);
		statusDetail.textContent = 'Stage: ' + stage + (percent >= 0 && stage === 'downloading' ? ' ' + percent + '%' : '') +
			' (' + inStage + ' s, ' + secs + ' s in all) · ' + deviceLine() +
			(tatoProblems.length ? ' · Problem: ' + tatoProblems.join(' | ') : '');
		statusDetail.style.display = 'block';
	}

	// If start-up stalls, say so and show what is known instead of sitting silent.
	const watchdog = setInterval(function () {
		if (!initializing) {
			clearInterval(watchdog);
			return;
		}
		const inStage = (Date.now() - stageSince) / 1000;
		if (debug) { showDetail(); }
		if (stage === 'starting the game' && tatoProblems.length && inStage > 6) {
			statusTitle.textContent = 'The game could not start on this device';
			statusNotice.textContent = 'Please send a photo of this screen so it can be fixed.';
			statusNotice.style.display = 'block';
			showDetail();
		} else if (stage === 'starting the game' && inStage > 40) {
			statusTitle.textContent = 'Still starting...';
			statusNotice.textContent = 'Older iPads and iPhones can take a minute or two. If nothing happens, close other tabs and apps and reload. A photo of this screen helps to fix it.';
			statusNotice.style.display = 'block';
			showDetail();
		} else if (stage === 'downloading' && inStage > 90) {
			statusNotice.textContent = 'The download is slow. Check the Wi-Fi, or reload the page.';
			statusNotice.style.display = 'block';
			showDetail();
		} else if (stage === 'checking for a newer version' && inStage > 30) {
			showDetail();
		}
	}, 1000);

	function hideStatus() {
		if (!initializing) {
			return;
		}
		statusOverlay.remove();
		initializing = false;
	}

	function displayFailureNotice(err, title) {
		console.error(err);
		let text = 'Something went wrong while loading.';
		if (err instanceof Error) {
			text = err.message;
		} else if (typeof err === 'string') {
			text = err;
		}
		statusProgress.style.display = 'none';
		statusTitle.textContent = title || 'Oh no!';
		statusNotice.textContent = title ? text : text + ' Try reloading the page.';
		statusNotice.style.display = 'block';
		initializing = false;
	}

	// The engine is built with WebAssembly SIMD. Safari gained it in iOS / iPadOS 16.4;
	// an older system cannot read the engine file at all (it fails with "WebAssembly.Module
	// doesn't parse"). Check first and say what to do, instead of downloading 100 MB to fail.
	function hasWasmSimd() {
		try {
			return WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123,
				3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]));
		} catch (e) {
			return false;
		}
	}

	// Stop the page itself from scrolling, zooming or showing menus on long presses.
	['gesturestart', 'gesturechange', 'contextmenu'].forEach(function (name) {
		document.addEventListener(name, function (e) { e.preventDefault(); }, { passive: false });
	});

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('This browser is missing: ' + missing.join(', ') + '.');
		return;
	}
	// ?nosimd=1 shows this message on any device, to check how it looks
	if (!hasWasmSimd() || /[?&]nosimd=1/.test(window.location.search)) {
		const apple = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent || '');
		displayFailureNotice(apple
			? 'This device needs a software update before it can run TATO! The game needs iPadOS or iOS 16.4 or newer. On the device open Settings, then General, then Software Update, install the update, and come back to this page.'
			: 'This browser is too old to run TATO! Please update the browser, or try a current version of Safari, Chrome, Edge or Firefox.',
		'Update needed');
		showDetail();
		clearInterval(watchdog);
		return;
	}
	// The game is kept on the device so it opens quickly and works offline.
	// Before starting, ask whether a newer version has been published; if so
	// switch to it now (the page reloads itself) instead of one visit later.
	function checkForUpdate() {
		if (!('serviceWorker' in navigator)) {
			return Promise.resolve();
		}
		return navigator.serviceWorker.getRegistration().then(function (reg) {
			if (!reg) {
				return undefined;
			}
			return new Promise(function (resolve) {
				let settled = false;
				function carryOn() {
					if (!settled) {
						settled = true;
						resolve();
					}
				}
				function switchTo(worker) {
					statusTitle.textContent = 'Getting the newest version...';
					worker.postMessage('update');
					setTimeout(carryOn, 8000); // the reload normally happens first
				}
				function watch(worker) {
					if (!worker) {
						return;
					}
					worker.addEventListener('statechange', function () {
						if (worker.state === 'installed') {
							switchTo(worker);
						} else if (worker.state === 'redundant') {
							carryOn();
						}
					});
				}
				const quick = setTimeout(carryOn, 3000); // offline or slow: just play
				if (reg.waiting) {
					clearTimeout(quick);
					switchTo(reg.waiting);
					return;
				}
				reg.addEventListener('updatefound', function () {
					clearTimeout(quick);
					setTimeout(carryOn, 20000);
					watch(reg.installing);
				});
				reg.update().then(function () {
					if (!reg.installing && !reg.waiting) {
						clearTimeout(quick);
						carryOn();
					}
				}).catch(function () {
					clearTimeout(quick);
					carryOn();
				});
			});
		}).catch(function () { return undefined; });
	}

	window.tatoReady = hideStatus;
	checkForUpdate().then(function () {
		setStage('downloading', 'Warming up the kitchen...');
		return engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					percent = Math.floor(100 * current / total);
					if (current >= total) {
						// everything is on the device; the engine now has to start up
						setStage('starting the game', 'Starting the game...');
					} else {
						setStage('downloading', 'Warming up the kitchen... ' + percent + '%');
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		});
	}).then(function () {
		// The game calls window.tatoReady() once its first screen is drawn;
		// keep the loading picture up until then (or 12 s at most).
		setStage('drawing the first screen', 'Almost ready...');
		setTimeout(hideStatus, 12000);
	}, displayFailureNotice);
}());
		</script>
	</body>
</html>
